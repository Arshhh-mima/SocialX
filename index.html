```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>SocialSpace</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#fafafa;
    color:#111;
}

body{
    overflow-x:hidden;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

img,video{
    max-width:100%;
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
}

.topbar{
    height:62px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:23px;
    font-weight:700;
}

.brand img{
    width:38px;
    height:38px;
    object-fit:contain;
    border-radius:9px;
}

.search{
    width:300px;
    position:relative;
}

.search input{
    width:100%;
    padding:10px 14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    background:#f5f5f5;
}

.top-actions{
    display:flex;
    gap:9px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    border-radius:10px;
    font-size:19px;
}

.icon-btn:hover{
    background:#f1f1f1;
}

/* =========================
   DESKTOP LAYOUT
========================= */

.layout{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:230px minmax(0,630px) 280px;
    gap:24px;
    padding:25px 15px 90px;
}

.sidebar{
    position:sticky;
    top:85px;
    height:max-content;
}

.nav-item{
    width:100%;
    border:0;
    background:transparent;
    padding:13px 14px;
    text-align:left;
    border-radius:12px;
    margin-bottom:5px;
    font-size:15px;
}

.nav-item:hover,
.nav-item.active{
    background:#eee;
    font-weight:600;
}

.right-card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:14px;
    padding:17px;
    margin-bottom:15px;
}

.right-card h3{
    font-size:15px;
    margin-bottom:14px;
}

.suggestion{
    display:flex;
    align-items:center;
    gap:10px;
    margin:13px 0;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ddd;
    object-fit:cover;
}

.suggestion-info{
    flex:1;
}

.suggestion-info b{
    display:block;
    font-size:14px;
}

.suggestion-info span{
    color:#777;
    font-size:12px;
}

.follow-btn{
    border:0;
    background:#111;
    color:white;
    border-radius:8px;
    padding:7px 10px;
    font-size:12px;
}

/* =========================
   FEED
========================= */

.stories{
    display:flex;
    gap:13px;
    overflow-x:auto;
    padding:5px 2px 17px;
    scrollbar-width:none;
}

.stories::-webkit-scrollbar{
    display:none;
}

.story{
    min-width:68px;
    text-align:center;
    font-size:11px;
}

.story-ring{
    width:64px;
    height:64px;
    padding:2px;
    border-radius:50%;
    background:linear-gradient(135deg,#111,#888);
    margin:auto auto 5px;
}

.story-ring img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:2px solid white;
}

.add-story .story-ring{
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.post{
    background:#fff;
    border:1px solid #ddd;
    border-radius:14px;
    margin-bottom:22px;
    overflow:hidden;
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
}

.post-head .post-user{
    flex:1;
}

.post-user b{
    display:block;
    font-size:14px;
}

.post-user span{
    color:#777;
    font-size:11px;
}

.post-more{
    border:0;
    background:none;
    font-size:18px;
}

.post-media{
    width:100%;
    background:#111;
    display:flex;
    justify-content:center;
}

.post-media img,
.post-media video{
    width:100%;
    max-height:700px;
    object-fit:cover;
}

.post-actions{
    padding:10px 13px 4px;
    display:flex;
    gap:14px;
}

.post-actions button{
    border:0;
    background:none;
    font-size:22px;
}

.post-body{
    padding:4px 14px 16px;
}

.likes{
    font-size:13px;
    font-weight:600;
    margin-bottom:7px;
}

.caption{
    font-size:14px;
    line-height:1.5;
}

.caption b{
    margin-right:5px;
}

.comments{
    color:#777;
    font-size:13px;
    margin-top:8px;
}

/* =========================
   CREATE
========================= */

.create-card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:14px;
    padding:16px;
    margin-bottom:20px;
}

.create-tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:15px;
}

.create-tabs button{
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:9px;
    padding:10px;
}

.create-tabs button.active{
    background:#111;
    color:#fff;
}

.create-options{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.action-btn{
    border:1px solid #ddd;
    background:#fff;
    border-radius:9px;
    padding:9px 12px;
}

.action-btn:hover{
    background:#f3f3f3;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:500;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(760px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:18px;
    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.close{
    width:35px;
    height:35px;
    border:0;
    background:#eee;
    border-radius:50%;
}

.hidden{
    display:none!important;
}

/* =========================
   CAMERA
========================= */

.camera-area{
    background:#111;
    border-radius:14px;
    overflow:hidden;
    position:relative;
}

#cameraVideo{
    width:100%;
    display:block;
    max-height:55vh;
    object-fit:cover;
}

.camera-controls{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:12px;
    background:#111;
}

.camera-controls button{
    border:1px solid #555;
    background:#222;
    color:#fff;
    padding:10px 14px;
    border-radius:9px;
}

/* =========================
   EDITOR
========================= */

.editor-preview{
    width:100%;
    max-height:500px;
    display:flex;
    justify-content:center;
    background:#111;
    border-radius:12px;
    overflow:hidden;
}

.editor-preview img,
.editor-preview video{
    max-height:500px;
    width:100%;
    object-fit:contain;
}

.filter-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:14px;
}

.filter-btn{
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:9px 5px;
    font-size:12px;
}

.filter-btn.active{
    border-color:#111;
    background:#111;
    color:white;
}

.adjustments{
    margin-top:15px;
}

.adjustments label{
    display:block;
    font-size:13px;
    margin:10px 0 4px;
}

.adjustments input{
    width:100%;
}

.option-section{
    margin-top:18px;
}

.option-section h4{
    margin-bottom:9px;
    font-size:14px;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.option{
    padding:10px 5px;
    border:1px solid #ddd;
    background:white;
    border-radius:8px;
    text-align:center;
    font-size:12px;
}

.option.active{
    background:#111;
    color:#fff;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-top:14px;
}

.form-group label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
}

.form-group textarea{
    resize:vertical;
    min-height:85px;
}

.primary{
    width:100%;
    border:0;
    background:#111;
    color:white;
    padding:12px;
    border-radius:9px;
    margin-top:17px;
}

/* =========================
   MOBILE NAV
========================= */

.mobile-nav{
    display:none;
}

/* =========================
   PROFILE
========================= */

.profile-page{
    display:none;
}

.profile-header{
    background:#fff;
    border:1px solid #ddd;
    border-radius:14px;
    padding:25px;
    display:flex;
    align-items:center;
    gap:25px;
}

.profile-avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.profile-stats{
    display:flex;
    gap:25px;
    margin-top:13px;
}

.profile-stat b{
    display:block;
}

.profile-stat span{
    color:#777;
    font-size:12px;
}

.profile-grid{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:3px;
}

.profile-grid img,
.profile-grid video{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:80px;
    transform:translateX(-50%) translateY(20px);
    background:#111;
    color:#fff;
    padding:11px 16px;
    border-radius:9px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
    font-size:13px;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:950px){
    .layout{
        grid-template-columns:190px minmax(0,1fr);
    }

    .right-column{
        display:none;
    }

    .search{
        width:230px;
    }
}

@media(max-width:700px){
    body{
        background:#fafafa;
    }

    .topbar{
        height:56px;
        padding:0 12px;
    }

    .brand{
        font-size:19px;
    }

    .brand img{
        width:32px;
        height:32px;
    }

    .search{
        display:none;
    }

    .top-actions{
        gap:1px;
    }

    .icon-btn{
        width:37px;
        height:37px;
    }

    .layout{
        display:block;
        width:100%;
        padding:10px 0 75px;
    }

    .sidebar,
    .right-column{
        display:none;
    }

    .main{
        width:100%;
    }

    .stories{
        padding:4px 12px 13px;
        background:#fff;
        border-bottom:1px solid #ddd;
    }

    .post{
        border-radius:0;
        border-left:0;
        border-right:0;
        margin-bottom:8px;
    }

    .post-media img,
    .post-media video{
        max-height:none;
        aspect-ratio:1/1;
        object-fit:cover;
    }

    .create-card{
        border-radius:0;
        border-left:0;
        border-right:0;
        margin-bottom:8px;
    }

    .mobile-nav{
        display:flex;
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        height:62px;
        background:#fff;
        border-top:1px solid #ddd;
        z-index:300;
        padding-bottom:env(safe-area-inset-bottom);
    }

    .mobile-nav button{
        flex:1;
        border:0;
        background:#fff;
        font-size:12px;
    }

    .mobile-nav button.active{
        font-weight:700;
    }

    .modal{
        padding:0;
        align-items:flex-end;
    }

    .modal-box{
        width:100%;
        max-height:94vh;
        border-radius:18px 18px 0 0;
        padding:16px;
    }

    .filter-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .option-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .profile-header{
        border-radius:0;
        border-left:0;
        border-right:0;
        padding:18px;
    }

    .profile-avatar{
        width:75px;
        height:75px;
    }

    .profile-stats{
        gap:14px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- TOP BAR -->
<header class="topbar">

    <div class="brand">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <span>SocialSpace</span>
    </div>

    <div class="search">
        <input id="searchInput" type="search" placeholder="Search">
    </div>

    <div class="top-actions">
        <button class="icon-btn" onclick="openCreate()">+</button>
        <button class="icon-btn" onclick="showToast('Notifications opened')">Notifications</button>
    </div>

</header>


<div class="layout">

    <!-- LEFT -->
    <aside class="sidebar">

        <button class="nav-item active" onclick="showHome()">Home</button>
        <button class="nav-item" onclick="openCreate('post')">Create Post</button>
        <button class="nav-item" onclick="openCreate('reel')">Create Reel</button>
        <button class="nav-item" onclick="openCreate('story')">Create Story</button>
        <button class="nav-item" onclick="showProfile()">Profile</button>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- FEED -->
        <section id="homePage">

            <!-- STORIES -->
            <div class="stories" id="storiesContainer">

                <div class="story add-story" onclick="openCreate('story')">
                    <div class="story-ring">+</div>
                    <span>Your Story</span>
                </div>

            </div>


            <!-- CREATE -->
            <div class="create-card">

                <div class="create-tabs">

                    <button onclick="openCreate('post')">
                        Photo
                    </button>

                    <button onclick="openCreate('reel')">
                        Reel
                    </button>

                    <button onclick="openCreate('story')">
                        Story
                    </button>

                </div>

                <div class="create-options">

                    <button class="action-btn" onclick="openCamera('post')">
                        Camera
                    </button>

                    <button class="action-btn" onclick="chooseFile('post')">
                        Gallery
                    </button>

                </div>

            </div>


            <!-- POSTS -->
            <div id="feed"></div>

        </section>


        <!-- PROFILE -->
        <section id="profilePage" class="profile-page">

            <div class="profile-header">

                <img id="profileAvatar"
                     class="profile-avatar"
                     src=""
                     alt="Profile">

                <div>

                    <h2 id="profileName">Your Profile</h2>

                    <div class="profile-stats">

                        <div class="profile-stat">
                            <b id="postCount">0</b>
                            <span>Posts</span>
                        </div>

                        <div class="profile-stat">
                            <b>0</b>
                            <span>Followers</span>
                        </div>

                        <div class="profile-stat">
                            <b>0</b>
                            <span>Following</span>
                        </div>

                    </div>

                </div>

            </div>

            <div class="profile-grid" id="profileGrid"></div>

        </section>

    </main>


    <!-- RIGHT -->
    <aside class="right-column">

        <div class="right-card">

            <h3>Suggestions</h3>

            <div class="suggestion">

                <div class="avatar"></div>

                <div class="suggestion-info">
                    <b>Discover</b>
                    <span>Find people to follow</span>
                </div>

                <button class="follow-btn"
                        onclick="showToast('Search people to follow')">
                    View
                </button>

            </div>

        </div>

    </aside>

</div>


<!-- MOBILE NAV -->
<nav class="mobile-nav">

    <button onclick="showHome()">Home</button>

    <button onclick="openCreate('story')">Story</button>

    <button onclick="openCreate('post')">Create</button>

    <button onclick="openCreate('reel')">Reel</button>

    <button onclick="showProfile()">Profile</button>

</nav>

</div>


<!-- =========================
     CREATE MODAL
========================= -->

<div class="modal" id="createModal">

<div class="modal-box">

    <div class="modal-header">

        <h2 id="createTitle">Create Post</h2>

        <button class="close" onclick="closeModal('createModal')">
            ×
        </button>

    </div>


    <div class="create-tabs">

        <button id="tabPost" onclick="setCreateType('post')">
            Photo
        </button>

        <button id="tabReel" onclick="setCreateType('reel')">
            Reel
        </button>

        <button id="tabStory" onclick="setCreateType('story')">
            Story
        </button>

    </div>


    <div class="create-options">

        <button class="action-btn"
                onclick="openCamera(currentCreateType)">
            Use Camera
        </button>

        <button class="action-btn"
                onclick="chooseFile(currentCreateType)">
            Choose From Gallery
        </button>

    </div>


    <input
        id="fileInput"
        class="hidden"
        type="file"
        accept="image/*,video/*"
        onchange="handleFile(event)"
    >


    <div id="editor" class="hidden">

        <div class="editor-preview">

            <img id="editorImage"
                 class="hidden"
                 alt="Preview">

            <video id="editorVideo"
                   class="hidden"
                   controls
                   playsinline>
            </video>

        </div>


        <!-- FILTERS -->
        <div class="option-section">

            <h4>Filters</h4>

            <div class="filter-grid">

                <button class="filter-btn active"
                        onclick="applyFilter('none',this)">
                    Original
                </button>

                <button class="filter-btn"
                        onclick="applyFilter('grayscale(1)',this)">
                    Mono
                </button>

                <button class="filter-btn"
                        onclick="applyFilter('sepia(.7)',this)">
                    Vintage
                </button>

                <button class="filter-btn"
                        onclick="applyFilter('contrast(1.25)',this)">
                    Contrast
                </button>

                <button class="filter-btn"
                        onclick="applyFilter('saturate(1.7)',this)">
                    Vivid
                </button>

                <button class="filter-btn"
                        onclick="applyFilter('brightness(1.2)',this)">
                    Bright
                </button>

                <button class="filter-btn"
                        onclick="applyFilter('hue-rotate(35deg)',this)">
                    Warm
                </button>

                <button class="filter-btn"
                        onclick="applyFilter('blur(.4px)',this)">
                    Soft
                </button>

            </div>

        </div>


        <!-- ADJUSTMENTS -->
        <div class="adjustments">

            <label>Brightness</label>
            <input id="brightness"
                   type="range"
                   min="50"
                   max="150"
                   value="100"
                   oninput="updateAdjustments()">

            <label>Contrast</label>
            <input id="contrast"
                   type="range"
                   min="50"
                   max="150"
                   value="100"
                   oninput="updateAdjustments()">

            <label>Saturation</label>
            <input id="saturation"
                   type="range"
                   min="0"
                   max="200"
                   value="100"
                   oninput="updateAdjustments()">

        </div>


        <!-- LAYOUTS -->
        <div class="option-section">

            <h4>Layout</h4>

            <div class="option-grid">

                <button class="option active"
                        onclick="chooseLayout('square',this)">
                    Square
                </button>

                <button class="option"
                        onclick="chooseLayout('portrait',this)">
                    Portrait
                </button>

                <button class="option"
                        onclick="chooseLayout('landscape',this)">
                    Landscape
                </button>

                <button class="option"
                        onclick="chooseLayout('full',this)">
                    Full Screen
                </button>

            </div>

        </div>


        <!-- STYLE -->
        <div class="option-section">

            <h4>Style</h4>

            <div class="option-grid">

                <button class="option active"
                        onclick="chooseStyle('clean',this)">
                    Clean
                </button>

                <button class="option"
                        onclick="chooseStyle('rounded',this)">
                    Rounded
                </button>

                <button class="option"
                        onclick="chooseStyle('border',this)">
                    Border
                </button>

                <button class="option"
                        onclick="chooseStyle('shadow',this)">
                    Shadow
                </button>

            </div>

        </div>


        <!-- MUSIC -->
        <div class="form-group">

            <label>Music</label>

            <select id="musicSelect">

                <option value="">No Music</option>
                <option value="Original Audio">Original Audio</option>
                <option value="Acoustic">Acoustic</option>
                <option value="Chill">Chill</option>
                <option value="Electronic">Electronic</option>
                <option value="Cinematic">Cinematic</option>

            </select>

            <small style="display:block;color:#777;margin-top:6px">
                Music names are selectable placeholders. Real songs require licensed audio files or a music service.
            </small>

        </div>


        <!-- CAPTION -->
        <div class="form-group">

            <label>Caption</label>

            <textarea id="captionInput"
                      placeholder="Write a caption... Use @username to mention someone"></textarea>

        </div>


        <!-- MENTION -->
        <div class="form-group">

            <label>Mention</label>

            <input id="mentionInput"
                   placeholder="@username">

        </div>


        <!-- STORY DURATION -->
        <div class="form-group" id="storyOptions">

            <label>Story Duration</label>

            <select id="storyDuration">

                <option value="24">24 hours</option>
                <option value="12">12 hours</option>
                <option value="6">6 hours</option>

            </select>

        </div>


        <button class="primary"
                onclick="publishContent()">
            Publish
        </button>

    </div>

</div>
</div>


<!-- =========================
     CAMERA MODAL
========================= -->

<div class="modal" id="cameraModal">

<div class="modal-box">

    <div class="modal-header">

        <h2>Camera</h2>

        <button class="close"
                onclick="stopCamera()">
            ×
        </button>

    </div>

    <div class="camera-area">

        <video id="cameraVideo"
               autoplay
               muted
               playsinline>
        </video>

        <div class="camera-controls">

            <button onclick="switchCamera()">
                Switch Camera
            </button>

            <button onclick="takePhoto()">
                Take Photo
            </button>

        </div>

    </div>

    <canvas id="cameraCanvas" class="hidden"></canvas>

</div>

</div>


<!-- TOAST -->
<div id="toast" class="toast"></div>


<script>
/* =========================================
   STATE
========================================= */

let currentCreateType = "post";
let currentMedia = null;
let currentMediaType = null;
let currentFilter = "none";
let currentLayout = "square";
let currentStyle = "clean";

let cameraStream = null;
let cameraFacing = "environment";

let posts = JSON.parse(localStorage.getItem("socialspace_posts") || "[]");
let stories = JSON.parse(localStorage.getItem("socialspace_stories") || "[]");


/* =========================================
   INIT
========================================= */

document.addEventListener("DOMContentLoaded", () => {

    renderFeed();
    renderStories();
    renderProfile();

});


/* =========================================
   MODALS
========================================= */

function openModal(id){
    document.getElementById(id).classList.add("show");
}

function closeModal(id){
    document.getElementById(id).classList.remove("show");
}

function openCreate(type="post"){

    currentCreateType = type;

    resetEditor();

    setCreateType(type);

    openModal("createModal");

}

function setCreateType(type){

    currentCreateType = type;

    document.getElementById("createTitle").textContent =
        type === "post" ? "Create Photo Post" :
        type === "reel" ? "Create Reel" :
        "Create Story";

    document.getElementById("tabPost").classList.toggle(
        "active", type === "post"
    );

    document.getElementById("tabReel").classList.toggle(
        "active", type === "reel"
    );

    document.getElementById("tabStory").classList.toggle(
        "active", type === "story"
    );

    document.getElementById("storyOptions")
        .classList.toggle("hidden", type !== "story");

}


/* =========================================
   FILE PICKER
========================================= */

function chooseFile(type){

    currentCreateType = type;

    const input = document.getElementById("fileInput");

    input.value = "";

    if(type === "reel"){
        input.accept = "video/*,image/*";
    }else{
        input.accept = "image/*,video/*";
    }

    input.click();

}

function handleFile(event){

    const file = event.target.files[0];

    if(!file) return;

    if(file.type.startsWith("image/")){

        currentMediaType = "image";

    }else if(file.type.startsWith("video/")){

        currentMediaType = "video";

    }else{

        showToast("Unsupported file");
        return;

    }

    const reader = new FileReader();

    reader.onload = function(e){

        currentMedia = e.target.result;

        showEditor();

    };

    reader.readAsDataURL(file);

}


/* =========================================
   EDITOR
========================================= */

function showEditor(){

    document.getElementById("editor").classList.remove("hidden");

    const image = document.getElementById("editorImage");
    const video = document.getElementById("editorVideo");

    image.classList.add("hidden");
    video.classList.add("hidden");

    if(currentMediaType === "image"){

        image.src = currentMedia;

        image.classList.remove("hidden");

    }else{

        video.src = currentMedia;

        video.classList.remove("hidden");

    }

    updateAdjustments();

}

function resetEditor(){

    currentMedia = null;
    currentMediaType = null;
    currentFilter = "none";
    currentLayout = "square";
    currentStyle = "clean";

    document.getElementById("editor").classList.add("hidden");

    document.getElementById("captionInput").value = "";
    document.getElementById("mentionInput").value = "";
    document.getElementById("musicSelect").value = "";

    document.getElementById("brightness").value = 100;
    document.getElementById("contrast").value = 100;
    document.getElementById("saturation").value = 100;

}


/* =========================================
   FILTERS
========================================= */

function applyFilter(filter,button){

    currentFilter = filter;

    document.querySelectorAll(".filter-btn")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    updateAdjustments();

}

function updateAdjustments(){

    const brightness =
        document.getElementById("brightness").value;

    const contrast =
        document.getElementById("contrast").value;

    const saturation =
        document.getElementById("saturation").value;

    const filter =
        currentFilter === "none" ? "" : currentFilter;

    const finalFilter =
        `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) ${filter}`;

    document.getElementById("editorImage").style.filter = finalFilter;
    document.getElementById("editorVideo").style.filter = finalFilter;

}


/* =========================================
   LAYOUTS
========================================= */

function chooseLayout(layout,button){

    currentLayout = layout;

    document.querySelectorAll(".option")
        .forEach(b => {

            if(
                b.parentElement === button.parentElement
            ){
                b.classList.remove("active");
            }

        });

    button.classList.add("active");

}


/* =========================================
   STYLES
========================================= */

function chooseStyle(style,button){

    currentStyle = style;

    document.querySelectorAll(".option")
        .forEach(b => {

            if(
                b.parentElement === button.parentElement
            ){
                b.classList.remove("active");
            }

        });

    button.classList.add("active");

}


/* =========================================
   CAMERA
========================================= */

async function openCamera(type="post"){

    currentCreateType = type;

    closeModal("createModal");

    openModal("cameraModal");

    try{

        cameraStream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:cameraFacing
            },

            audio:false

        });

        document.getElementById("cameraVideo").srcObject =
            cameraStream;

    }catch(error){

        closeModal("cameraModal");

        showToast(
            "Camera permission was denied or camera is unavailable"
        );

    }

}

async function switchCamera(){

    if(cameraStream){

        cameraStream.getTracks().forEach(
            track => track.stop()
        );

    }

    cameraFacing =
        cameraFacing === "environment"
        ? "user"
        : "environment";

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:cameraFacing
                },

                audio:false

            });

        document.getElementById("cameraVideo").srcObject =
            cameraStream;

    }catch(error){

        showToast("Unable to switch camera");

    }

}

function takePhoto(){

    const video =
        document.getElementById("cameraVideo");

    const canvas =
        document.getElementById("cameraCanvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    if(cameraFacing === "user"){

        ctx.translate(canvas.width,0);
        ctx.scale(-1,1);

    }

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    currentMedia =
        canvas.toDataURL("image/jpeg",0.9);

    currentMediaType = "image";

    stopCamera(false);

    openCreate(currentCreateType);

    showEditor();

}

function stopCamera(close=true){

    if(cameraStream){

        cameraStream.getTracks().forEach(
            track => track.stop()
        );

        cameraStream = null;

    }

    if(close){
        closeModal("cameraModal");
    }

}


/* =========================================
   PUBLISH
========================================= */

function publishContent(){

    if(!currentMedia){

        showToast("Choose a photo or video first");

        return;

    }

    const caption =
        document.getElementById("captionInput").value.trim();

    const mention =
        document.getElementById("mentionInput").value.trim();

    const music =
        document.getElementById("musicSelect").value;

    const item = {

        id:Date.now(),

        type:currentCreateType,

        mediaType:currentMediaType,

        media:currentMedia,

        caption:caption,

        mention:mention,

        music:music,

        layout:currentLayout,

        style:currentStyle,

        likes:0,

        comments:[],

        createdAt:new Date().toISOString()

    };


    if(currentCreateType === "story"){

        item.expiresAt =
            Date.now() +
            Number(
                document.getElementById("storyDuration").value
            ) * 60 * 60 * 1000;

        stories.unshift(item);

        localStorage.setItem(
            "socialspace_stories",
            JSON.stringify(stories)
        );

        renderStories();

        showToast("Story added");

    }else{

        posts.unshift(item);

        localStorage.setItem(
            "socialspace_posts",
            JSON.stringify(posts)
        );

        renderFeed();

        renderProfile();

        showToast(
            currentCreateType === "reel"
            ? "Reel published"
            : "Post published"
        );

    }

    closeModal("createModal");

    resetEditor();

}


/* =========================================
   FEED
========================================= */

function renderFeed(){

    const feed =
        document.getElementById("feed");

    feed.innerHTML = "";

    if(posts.length === 0){

        feed.innerHTML = `

            <div class="post">

                <div style="
                    padding:45px 20px;
                    text-align:center;
                    color:#777;
                ">

                    No posts yet.<br>
                    Create your first photo, reel or story.

                </div>

            </div>

        `;

        return;

    }

    posts.forEach(post => {

        const article =
            document.createElement("article");

        article.className = "post";

        article.innerHTML = `

            <div class="post-head">

                <div class="avatar"
                     style="display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:12px;">
                    You
                </div>

                <div class="post-user">

                    <b>Your Account</b>

                    <span>
                        ${post.type === "reel" ? "Reel" : "Post"}
                    </span>

                </div>

                <button class="post-more"
                        onclick="deletePost(${post.id})">
                    ...
                </button>

            </div>

            <div class="post-media"
                 style="${getMediaStyle(post)}">

                ${
                    post.mediaType === "image"

                    ?

                    `<img
                        src="${post.media}"
                        style="${getImageStyle(post)}"
                        alt="Post"
                    >`

                    :

                    `<video
                        src="${post.media}"
                        controls
                        playsinline
                        style="${getImageStyle(post)}"
                    ></video>`
                }

            </div>

            <div class="post-actions">

                <button onclick="likePost(${post.id})">
                    Like
                </button>

                <button onclick="commentPost(${post.id})">
                    Comment
                </button>

                <button onclick="sharePost(${post.id})">
                    Share
                </button>

            </div>

            <div class="post-body">

                <div class="likes">
                    ${post.likes} likes
                </div>

                <div class="caption">

                    <b>Your Account</b>

                    ${escapeHTML(post.caption)}

                    ${
                        post.mention
                        ? ` <b>${escapeHTML(post.mention)}</b>`
                        : ""
                    }

                </div>

                ${
                    post.music
                    ? `<div style="
                        margin-top:8px;
                        color:#777;
                        font-size:12px;">
                        Music: ${escapeHTML(post.music)}
                       </div>`
                    : ""
                }

                <div class="comments">
                    ${post.comments.length} comments
                </div>

            </div>

        `;

        feed.appendChild(article);

    });

}


/* =========================================
   MEDIA STYLE
========================================= */

function getMediaStyle(post){

    let style = "";

    if(post.style === "rounded"){
        style += "border-radius:18px;";
    }

    if(post.style === "border"){
        style += "padding:10px;";
    }

    if(post.style === "shadow"){
        style += "box-shadow:inset 0 0 25px rgba(0,0,0,.3);";
    }

    return style;

}

function getImageStyle(post){

    let style =
        "width:100%;display:block;object-fit:cover;";

    if(post.layout === "square"){
        style += "aspect-ratio:1/1;";
    }

    if(post.layout === "portrait"){
        style += "aspect-ratio:4/5;";
    }

    if(post.layout === "landscape"){
        style += "aspect-ratio:16/9;";
    }

    if(post.layout === "full"){
        style += "aspect-ratio:auto;max-height:750px;";
    }

    return style;

}


/* =========================================
   LIKE
========================================= */

function likePost(id){

    const post =
        posts.find(p => p.id === id);

    if(!post) return;

    post.likes++;

    localStorage.setItem(
        "socialspace_posts",
        JSON.stringify(posts)
    );

    renderFeed();

}


/* =========================================
   COMMENT
========================================= */

function commentPost(id){

    const comment =
        prompt("Write a comment:");

    if(!comment) return;

    const post =
        posts.find(p => p.id === id);

    if(!post) return;

    post.comments.push(comment);

    localStorage.setItem(
        "socialspace_posts",
        JSON.stringify(posts)
    );

    renderFeed();

}


/* =========================================
   SHARE
========================================= */

async function sharePost(id){

    const post =
        posts.find(p => p.id === id);

    if(!post) return;

    if(navigator.share){

        try{

            await navigator.share({
                title:"SocialSpace Post",
                text:post.caption || "Check out this post"
            });

        }catch(e){}

    }else{

        showToast("Sharing is not supported by this browser");

    }

}


/* =========================================
   DELETE
========================================= */

function deletePost(id){

    const confirmed =
        confirm("Delete this post?");

    if(!confirmed) return;

    posts =
        posts.filter(p => p.id !== id);

    localStorage.setItem(
        "socialspace_posts",
        JSON.stringify(posts)
    );

    renderFeed();
    renderProfile();

}


/* =========================================
   STORIES
========================================= */

function renderStories(){

    const container =
        document.getElementById("storiesContainer");

    container.innerHTML = `

        <div class="story add-story"
             onclick="openCreate('story')">

            <div class="story-ring">+</div>

            <span>Your Story</span>

        </div>

    `;

    const now = Date.now();

    stories =
        stories.filter(
            story =>
            !story.expiresAt ||
            story.expiresAt > now
        );

    localStorage.setItem(
        "socialspace_stories",
        JSON.stringify(stories)
    );


    stories.forEach(story => {

        const div =
            document.createElement("div");

        div.className = "story";

        div.innerHTML = `

            <div class="story-ring">

                ${
                    story.mediaType === "image"

                    ?

                    `<img src="${story.media}" alt="Story">`

                    :

                    `<video src="${story.media}"
                            muted
                            playsinline>
                     </video>`
                }

            </div>

            <span>Your Story</span>

        `;

        div.onclick = () => viewStory(story);

        container.appendChild(div);

    });

}

function viewStory(story){

    if(story.mediaType === "image"){

        const w =
            window.open("");

        if(w){

            w.document.write(`
                <body style="
                    margin:0;
                    background:#000;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    min-height:100vh;
                ">
                    <img src="${story.media}"
                         style="
                         max-width:100%;
                         max-height:100vh;
                         object-fit:contain;
                         ">
                </body>
            `);

        }

    }else{

        const w =
            window.open("");

        if(w){

            w.document.write(`
                <body style="
                    margin:0;
                    background:#000;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    min-height:100vh;
                ">
                    <video src="${story.media}"
                           controls
                           autoplay
                           playsinline
                           style="
                           max-width:100%;
                           max-height:100vh;
                           ">
                    </video>
                </body>
            `);

        }

    }

}


/* =========================================
   PROFILE
========================================= */

function showProfile(){

    document.getElementById("homePage")
        .style.display = "none";

    document.getElementById("profilePage")
        .style.display = "block";

    renderProfile();

}

function showHome(){

    document.getElementById("homePage")
        .style.display = "block";

    document.getElementById("profilePage")
        .style.display = "none";

}

function renderProfile(){

    const count =
        document.getElementById("postCount");

    if(count){
        count.textContent = posts.length;
    }

    const grid =
        document.getElementById("profileGrid");

    if(!grid) return;

    grid.innerHTML = "";

    posts.forEach(post => {

        if(post.mediaType === "image"){

            const img =
                document.createElement("img");

            img.src = post.media;

            grid.appendChild(img);

        }else{

            const video =
                document.createElement("video");

            video.src = post.media;
            video.muted = true;

            grid.appendChild(video);

        }

    });

}


/* =========================================
   SEARCH
========================================= */

document.getElementById("searchInput")
    .addEventListener("input", function(){

        const query =
            this.value.toLowerCase().trim();

        document.querySelectorAll(".post")
            .forEach(post => {

                if(!query){

                    post.style.display = "";

                    return;

                }

                post.style.display =
                    post.innerText
                    .toLowerCase()
                    .includes(query)
                    ? ""
                    : "none";

            });

    });


/* =========================================
   TOAST
========================================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },2500);

}


/* =========================================
   SECURITY / TEXT
========================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =========================================
   SERVICE WORKER / PWA
========================================= */

if("serviceWorker" in navigator){

    window.addEventListener("load", () => {

        /*
         * A service worker requires a separate file
         * and HTTPS/localhost in normal browsers.
         *
         * This single-file version intentionally does
         * not register a fake service worker.
         */

    });

}


/* =========================================
   CAMERA SUPPORT CHECK
========================================= */

if(!navigator.mediaDevices ||
   !navigator.mediaDevices.getUserMedia){

    console.log(
        "Camera API is unavailable in this browser/context."
    );

}

</script>

</body>
</html>
