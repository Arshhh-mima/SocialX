<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social App</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fafafa;
    color:#111;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    height:64px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.search{
    width:280px;
    padding:11px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    background:#f5f5f5;
}

.top-actions{
    display:flex;
    gap:10px;
}

.top-actions button{
    border:0;
    background:white;
    padding:10px 14px;
    font-weight:600;
}

.sidebar{
    position:fixed;
    top:64px;
    bottom:0;
    left:0;
    width:230px;
    background:white;
    border-right:1px solid #ddd;
    padding:25px 15px;
}

.nav-btn{
    width:100%;
    text-align:left;
    padding:14px;
    border:0;
    background:white;
    border-radius:10px;
    margin-bottom:7px;
    font-size:15px;
    font-weight:600;
}

.nav-btn:hover{
    background:#f1f1f1;
}

.main{
    max-width:720px;
    margin:90px auto 80px;
}

.stories{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:16px;
    display:flex;
    gap:15px;
    overflow-x:auto;
    margin-bottom:20px;
}

.story-item{
    min-width:70px;
    text-align:center;
    font-size:12px;
}

.story-circle{
    width:58px;
    height:58px;
    border-radius:50%;
    margin:auto auto 6px;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    border:3px solid white;
    outline:2px solid #111;
}

.create-box{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.create-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:15px;
}

.create-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.create-main-btn{
    border:1px solid #ccc;
    background:white;
    padding:17px 10px;
    border-radius:10px;
    font-weight:700;
    transition:.2s;
}

.create-main-btn:hover{
    background:#111;
    color:white;
}

.create-main-btn.primary{
    background:#111;
    color:white;
    border-color:#111;
}

.create-main-btn.primary:hover{
    background:#333;
}

.post{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:22px;
    overflow:hidden;
}

.post-head{
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.user-info{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.username{
    font-weight:700;
}

.post-media{
    width:100%;
    background:#111;
    display:block;
    max-height:720px;
    object-fit:contain;
}

.post-actions{
    padding:12px 15px;
    display:flex;
    gap:12px;
}

.action-btn{
    border:0;
    background:white;
    font-weight:600;
}

.caption{
    padding:0 16px 16px;
    line-height:1.5;
}

.delete-btn{
    border:0;
    background:white;
    color:#d00;
    font-size:12px;
}

.empty{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:40px 20px;
    text-align:center;
    color:#777;
}

.mobile-nav{
    display:none;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:650px;
    max-height:92vh;
    overflow:auto;
    border-radius:16px;
    padding:22px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.close{
    border:0;
    background:white;
    font-size:25px;
}

.type-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:20px;
}

.type-btn{
    padding:13px;
    border:1px solid #ccc;
    background:white;
    border-radius:8px;
    font-weight:700;
}

.type-btn.active{
    background:#111;
    color:white;
}

.media-choice{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.media-choice button{
    padding:20px 10px;
    border:1px solid #ccc;
    background:#fafafa;
    border-radius:10px;
    font-weight:700;
}

.media-preview{
    margin-top:18px;
    text-align:center;
}

.media-preview img,
.media-preview video{
    width:100%;
    max-height:430px;
    object-fit:contain;
    background:#111;
    border-radius:10px;
}

.editor{
    display:none;
}

.editor.show{
    display:block;
}

.field{
    margin-top:15px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.publish{
    width:100%;
    margin-top:18px;
    padding:13px;
    background:#111;
    color:white;
    border:0;
    border-radius:8px;
    font-weight:700;
}

.camera-area{
    display:none;
}

.camera-area.show{
    display:block;
}

#cameraVideo,
#reelCameraVideo{
    width:100%;
    background:#111;
    border-radius:10px;
}

.camera-buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.camera-buttons button{
    flex:1;
    padding:12px;
    border:1px solid #ccc;
    background:white;
    border-radius:8px;
    font-weight:700;
}

.recording{
    background:#b00000 !important;
    color:white !important;
}

.filters{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-top:12px;
}

.filter-btn{
    white-space:nowrap;
    border:1px solid #ccc;
    background:white;
    padding:8px 12px;
    border-radius:20px;
}

.filter-btn.active{
    background:#111;
    color:white;
}

.controls{
    margin-top:15px;
}

.range{
    margin-bottom:12px;
}

.range label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:5px;
}

.range input{
    width:100%;
}

/* MOBILE */

@media(max-width:850px){

    .topbar{
        padding:0 14px;
    }

    .search{
        display:none;
    }

    .sidebar{
        display:none;
    }

    .main{
        width:100%;
        margin:75px auto 85px;
        padding:0 10px;
    }

    .create-box{
        border-radius:10px;
    }

    .create-buttons{
        grid-template-columns:1fr;
    }

    .create-main-btn{
        padding:16px;
    }

    .mobile-nav{
        position:fixed;
        display:grid;
        grid-template-columns:repeat(5,1fr);
        bottom:0;
        left:0;
        right:0;
        height:65px;
        background:white;
        border-top:1px solid #ddd;
        z-index:300;
    }

    .mobile-nav button{
        border:0;
        background:white;
        font-size:11px;
        font-weight:700;
    }

    .mobile-nav .add{
        background:#111;
        color:white;
        margin:10px;
        border-radius:8px;
    }

    .post-media{
        max-height:600px;
    }

    .modal{
        align-items:flex-end;
        padding:0;
    }

    .modal-box{
        max-height:94vh;
        border-radius:18px 18px 0 0;
    }

    .type-buttons{
        grid-template-columns:1fr 1fr 1fr;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="logo">Social</div>

    <input
        class="search"
        id="searchInput"
        placeholder="Search"
        oninput="searchPosts()"
    >

    <div class="top-actions">
        <button onclick="openCreate('photo')">Create</button>
    </div>
</header>

<aside class="sidebar">

    <button class="nav-btn" onclick="showHome()">Home</button>
    <button class="nav-btn" onclick="openCreate('photo')">Create Photo</button>
    <button class="nav-btn" onclick="openCreate('reel')">Create Reel</button>
    <button class="nav-btn" onclick="openCreate('story')">Create Story</button>
    <button class="nav-btn" onclick="showProfile()">Profile</button>

</aside>

<main class="main">

    <section class="stories" id="stories">
        <div class="story-item">
            <div class="story-circle">+</div>
            <div>Add Story</div>
        </div>
    </section>

    <section class="create-box">

        <div class="create-title">Create something</div>

        <div class="create-buttons">

            <button
                class="create-main-btn primary"
                onclick="openCreate('photo')">
                Create Photo Post
            </button>

            <button
                class="create-main-btn"
                onclick="openCreate('reel')">
                Create Reel
            </button>

            <button
                class="create-main-btn"
                onclick="openCreate('story')">
                Add Story
            </button>

        </div>

    </section>

    <section id="feed"></section>

</main>

<nav class="mobile-nav">

    <button onclick="showHome()">Home</button>

    <button onclick="openCreate('story')">Story</button>

    <button class="add" onclick="openCreate('photo')">Create</button>

    <button onclick="openCreate('reel')">Reel</button>

    <button onclick="showProfile()">Profile</button>

</nav>


<!-- CREATE MODAL -->

<div class="modal" id="createModal">

    <div class="modal-box">

        <div class="modal-head">
            <h2>Create</h2>
            <button class="close" onclick="closeCreate()">×</button>
        </div>

        <div class="type-buttons">

            <button
                class="type-btn active"
                id="photoTypeBtn"
                onclick="setType('photo')">
                Photo
            </button>

            <button
                class="type-btn"
                id="reelTypeBtn"
                onclick="setType('reel')">
                Reel
            </button>

            <button
                class="type-btn"
                id="storyTypeBtn"
                onclick="setType('story')">
                Story
            </button>

        </div>


        <!-- PHOTO/REEL/STORY SELECT -->

        <div id="choiceArea">

            <div class="media-choice">

                <button onclick="chooseGallery()">
                    Choose From Gallery
                </button>

                <button onclick="openCamera()">
                    Use Camera
                </button>

            </div>

            <input
                type="file"
                id="fileInput"
                hidden
                accept="image/*"
                onchange="handleFile(event)"
            >

        </div>


        <!-- CAMERA -->

        <div class="camera-area" id="cameraArea">

            <video id="cameraVideo" autoplay playsinline></video>

            <div class="camera-buttons">

                <button onclick="capturePhoto()">
                    Take Photo
                </button>

                <button onclick="startReelRecording()" id="recordBtn">
                    Start Recording
                </button>

                <button onclick="stopCamera()">
                    Close Camera
                </button>

            </div>

        </div>


        <!-- EDITOR -->

        <div class="editor" id="editor">

            <div class="media-preview" id="preview"></div>

            <div class="filters">

                <button class="filter-btn active" onclick="applyFilter('none',this)">
                    Original
                </button>

                <button class="filter-btn" onclick="applyFilter('grayscale(1)',this)">
                    Mono
                </button>

                <button class="filter-btn" onclick="applyFilter('sepia(.7)',this)">
                    Vintage
                </button>

                <button class="filter-btn" onclick="applyFilter('contrast(1.4)',this)">
                    Contrast
                </button>

                <button class="filter-btn" onclick="applyFilter('saturate(1.7)',this)">
                    Vivid
                </button>

                <button class="filter-btn" onclick="applyFilter('brightness(1.25)',this)">
                    Bright
                </button>

                <button class="filter-btn" onclick="applyFilter('warm',this)">
                    Warm
                </button>

            </div>


            <div class="controls">

                <div class="range">
                    <label>
                        <span>Brightness</span>
                        <span id="brightnessValue">100%</span>
                    </label>

                    <input
                        type="range"
                        min="50"
                        max="150"
                        value="100"
                        oninput="changeBrightness(this.value)"
                    >
                </div>

                <div class="range">

                    <label>
                        <span>Contrast</span>
                        <span id="contrastValue">100%</span>
                    </label>

                    <input
                        type="range"
                        min="50"
                        max="150"
                        value="100"
                        oninput="changeContrast(this.value)"
                    >

                </div>

                <div class="range">

                    <label>
                        <span>Saturation</span>
                        <span id="saturationValue">100%</span>
                    </label>

                    <input
                        type="range"
                        min="0"
                        max="200"
                        value="100"
                        oninput="changeSaturation(this.value)"
                    >

                </div>

            </div>


            <div class="field">

                <label>Caption</label>

                <textarea
                    id="caption"
                    placeholder="Write a caption..."
                ></textarea>

            </div>


            <div class="field">

                <label>Mention</label>

                <input
                    id="mention"
                    placeholder="@username"
                >

            </div>


            <div class="field">

                <label>Music</label>

                <select id="music">

                    <option value="">No Music</option>
                    <option value="Summer">Summer</option>
                    <option value="Night">Night</option>
                    <option value="Dream">Dream</option>
                    <option value="Energy">Energy</option>

                </select>

            </div>


            <button
                class="publish"
                onclick="publishContent()">
                Publish
            </button>

        </div>

    </div>

</div>


<script>

let currentType = "photo";
let currentMedia = null;
let currentMediaURL = null;

let stream = null;
let mediaRecorder = null;
let recordedChunks = [];
let recording = false;

let brightness = 100;
let contrast = 100;
let saturation = 100;
let selectedFilter = "none";


/* STORAGE */

function getPosts(){

    try{
        return JSON.parse(localStorage.getItem("social_posts")) || [];
    }catch{
        return [];
    }

}

function savePosts(posts){

    localStorage.setItem(
        "social_posts",
        JSON.stringify(posts)
    );

}


/* CREATE */

function openCreate(type="photo"){

    document.getElementById("createModal")
        .classList.add("show");

    setType(type);

}


function closeCreate(){

    document.getElementById("createModal")
        .classList.remove("show");

    stopCamera();

    resetCreate();

}


function resetCreate(){

    currentMedia = null;
    currentMediaURL = null;

    document.getElementById("choiceArea").style.display = "block";

    document.getElementById("cameraArea").classList.remove("show");

    document.getElementById("editor").classList.remove("show");

    document.getElementById("preview").innerHTML = "";

    document.getElementById("caption").value = "";

    document.getElementById("mention").value = "";

    document.getElementById("music").value = "";

    brightness = 100;
    contrast = 100;
    saturation = 100;
    selectedFilter = "none";

}


function setType(type){

    currentType = type;

    document
        .getElementById("photoTypeBtn")
        .classList.toggle("active",type==="photo");

    document
        .getElementById("reelTypeBtn")
        .classList.toggle("active",type==="reel");

    document
        .getElementById("storyTypeBtn")
        .classList.toggle("active",type==="story");


    const fileInput =
        document.getElementById("fileInput");


    if(type==="photo" || type==="story"){

        fileInput.accept = "image/*";

    }else{

        fileInput.accept = "video/*";

    }

}


/* GALLERY */

function chooseGallery(){

    document
        .getElementById("fileInput")
        .click();

}


function handleFile(event){

    const file = event.target.files[0];

    if(!file) return;


    if(currentType==="reel" && !file.type.startsWith("video/")){

        alert("Please select a video for Reel.");

        return;

    }


    if(
        (currentType==="photo" || currentType==="story")
        &&
        !file.type.startsWith("image/")
    ){

        alert("Please select an image.");

        return;

    }


    currentMedia = file;

    currentMediaURL = URL.createObjectURL(file);

    showEditor();

}


/* EDITOR */

function showEditor(){

    document.getElementById("choiceArea").style.display = "none";

    document.getElementById("cameraArea")
        .classList.remove("show");

    document.getElementById("editor")
        .classList.add("show");


    const preview =
        document.getElementById("preview");


    if(currentMedia.type.startsWith("video/")){

        preview.innerHTML =
            `<video
                id="editorVideo"
                src="${currentMediaURL}"
                controls
                playsinline>
            </video>`;

    }else{

        preview.innerHTML =
            `<img
                id="editorImage"
                src="${currentMediaURL}"
                alt="Preview">`;

    }

}


/* CAMERA */

async function openCamera(){

    try{

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:true,
                audio: currentType==="reel"

            });


        const video =
            document.getElementById("cameraVideo");

        video.srcObject = stream;

        document.getElementById("choiceArea")
            .style.display = "none";

        document.getElementById("cameraArea")
            .classList.add("show");


        const recordBtn =
            document.getElementById("recordBtn");


        if(currentType==="photo" || currentType==="story"){

            recordBtn.style.display = "none";

        }else{

            recordBtn.style.display = "block";

        }

    }catch(error){

        alert(
            "Camera permission is required. Please allow camera access in your browser."
        );

    }

}


function capturePhoto(){

    if(!stream) return;


    const video =
        document.getElementById("cameraVideo");


    const canvas =
        document.createElement("canvas");


    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;


    const ctx =
        canvas.getContext("2d");


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvas.toBlob(function(blob){

        currentMedia =
            new File(
                [blob],
                "camera-photo.jpg",
                {type:"image/jpeg"}
            );


        currentMediaURL =
            URL.createObjectURL(blob);


        stopCamera();

        showEditor();

    },"image/jpeg",.92);

}


/* REEL RECORDING */

function startReelRecording(){

    if(!stream) return;

    if(recording){

        stopReelRecording();

        return;

    }


    recordedChunks = [];


    let options = {};

    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9,opus"
        )
    ){

        options.mimeType =
            "video/webm;codecs=vp9,opus";

    }


    try{

        mediaRecorder =
            new MediaRecorder(stream,options);

    }catch{

        mediaRecorder =
            new MediaRecorder(stream);

    }


    mediaRecorder.ondataavailable = function(e){

        if(e.data.size > 0){

            recordedChunks.push(e.data);

        }

    };


    mediaRecorder.onstop = function(){

        const blob =
            new Blob(
                recordedChunks,
                {type:mediaRecorder.mimeType || "video/webm"}
            );


        currentMedia =
            new File(
                [blob],
                "recorded-reel.webm",
                {type:blob.type}
            );


        currentMediaURL =
            URL.createObjectURL(blob);


        stopCamera();

        showEditor();

    };


    mediaRecorder.start();

    recording = true;


    const btn =
        document.getElementById("recordBtn");

    btn.textContent = "Stop Recording";

    btn.classList.add("recording");

}


function stopReelRecording(){

    if(
        mediaRecorder &&
        recording
    ){

        mediaRecorder.stop();

        recording = false;

    }

}


/* CAMERA STOP */

function stopCamera(){

    if(stream){

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;

    }


    const video =
        document.getElementById("cameraVideo");

    if(video){

        video.srcObject = null;

    }


    recording = false;

    const btn =
        document.getElementById("recordBtn");

    if(btn){

        btn.textContent = "Start Recording";

        btn.classList.remove("recording");

    }

}


/* FILTERS */

function applyFilter(filter,button){

    selectedFilter = filter;


    document
        .querySelectorAll(".filter-btn")
        .forEach(
            b => b.classList.remove("active")
        );


    button.classList.add("active");


    updatePreviewStyle();

}


function changeBrightness(value){

    brightness = value;

    document.getElementById("brightnessValue")
        .textContent = value + "%";

    updatePreviewStyle();

}


function changeContrast(value){

    contrast = value;

    document.getElementById("contrastValue")
        .textContent = value + "%";

    updatePreviewStyle();

}


function changeSaturation(value){

    saturation = value;

    document.getElementById("saturationValue")
        .textContent = value + "%";

    updatePreviewStyle();

}


function updatePreviewStyle(){

    const media =
        document.querySelector(
            "#preview img,#preview video"
        );

    if(!media) return;


    let filter =
        `brightness(${brightness}%)
         contrast(${contrast}%)
         saturate(${saturation}%)`;


    if(selectedFilter==="none"){

    }else{

        filter += " " + selectedFilter;

    }


    if(selectedFilter==="warm"){

        filter =
            `brightness(${brightness}%)
             contrast(${contrast}%)
             saturate(${saturation}%)
             sepia(.25)
             saturate(1.3)`;

    }


    media.style.filter = filter;

}


/* PUBLISH */

async function publishContent(){

    if(!currentMedia){

        alert("Please select or create media first.");

        return;

    }


    const caption =
        document.getElementById("caption").value.trim();


    const mention =
        document.getElementById("mention").value.trim();


    const music =
        document.getElementById("music").value;


    const reader =
        new FileReader();


    reader.onload = function(){

        const posts =
            getPosts();


        const post = {

            id:Date.now(),

            type:currentType,

            media:reader.result,

            caption:caption,

            mention:mention,

            music:music,

            likes:0,

            comments:[],

            createdAt:new Date().toISOString()

        };


        posts.unshift(post);

        savePosts(posts);


        closeCreate();

        renderFeed();

        renderStories();

    };


    reader.readAsDataURL(currentMedia);

}


/* FEED */

function renderFeed(){

    const feed =
        document.getElementById("feed");


    const posts =
        getPosts();


    if(posts.length===0){

        feed.innerHTML = `
            <div class="empty">
                No posts yet.<br><br>
                Create your first photo, reel or story.
            </div>
        `;

        return;

    }


    feed.innerHTML = posts.map(post => {

        let media = "";


        if(post.type==="reel"){

            media =
                `<video
                    class="post-media"
                    src="${post.media}"
                    controls
                    playsinline
                    loop>
                </video>`;

        }else{

            media =
                `<img
                    class="post-media"
                    src="${post.media}"
                    alt="Post">`;

        }


        return `

            <article class="post">

                <div class="post-head">

                    <div class="user-info">

                        <div class="avatar">U</div>

                        <div>

                            <div class="username">
                                Your Account
                            </div>

                            ${
                                post.type==="reel"
                                ? "<small>Reel</small>"
                                : post.type==="story"
                                ? "<small>Story</small>"
                                : ""
                            }

                        </div>

                    </div>


                    <button
                        class="delete-btn"
                        onclick="deletePost(${post.id})">
                        Delete
                    </button>

                </div>


                ${media}


                <div class="post-actions">

                    <button
                        class="action-btn"
                        onclick="likePost(${post.id})">
                        Like
                    </button>

                    <button
                        class="action-btn"
                        onclick="commentPost(${post.id})">
                        Comment
                    </button>

                    <button
                        class="action-btn"
                        onclick="sharePost(${post.id})">
                        Share
                    </button>

                </div>


                <div class="caption">

                    <strong>
                        Your Account
                    </strong>

                    ${escapeHTML(post.caption)}

                    ${
                        post.mention
                        ?
                        `<br>${escapeHTML(post.mention)}`
                        :
                        ""
                    }

                    ${
                        post.music
                        ?
                        `<br><small>Music: ${escapeHTML(post.music)}</small>`
                        :
                        ""
                    }

                </div>

            </article>

        `;

    }).join("");

}


/* LIKE */

function likePost(id){

    const posts = getPosts();

    const post =
        posts.find(p => p.id===id);

    if(post){

        post.likes =
            (post.likes || 0) + 1;

        savePosts(posts);

        renderFeed();

    }

}


/* COMMENT */

function commentPost(id){

    const comment =
        prompt("Write a comment:");

    if(!comment) return;


    const posts = getPosts();

    const post =
        posts.find(p => p.id===id);


    if(post){

        post.comments =
            post.comments || [];

        post.comments.push(comment);

        savePosts(posts);

        alert("Comment added.");

    }

}


/* SHARE */

async function sharePost(id){

    const url =
        location.href + "#post-" + id;


    if(navigator.share){

        try{

            await navigator.share({
                title:"Social Post",
                text:"Check this post",
                url:url
            });

        }catch{}

    }else{

        try{

            await navigator.clipboard.writeText(url);

            alert("Post link copied.");

        }catch{

            alert(url);

        }

    }

}


/* DELETE */

function deletePost(id){

    if(!confirm("Delete this post?")) return;


    const posts =
        getPosts()
        .filter(p => p.id!==id);


    savePosts(posts);

    renderFeed();

    renderStories();

}


/* STORIES */

function renderStories(){

    const container =
        document.getElementById("stories");


    const posts =
        getPosts()
        .filter(p => p.type==="story");


    container.innerHTML = `

        <div
            class="story-item"
            onclick="openCreate('story')">

            <div class="story-circle">+</div>

            <div>Add Story</div>

        </div>

    `;


    posts.slice(0,10).forEach(post => {

        container.innerHTML += `

            <div class="story-item">

                <img
                    src="${post.media}"
                    class="story-circle"
                    style="object-fit:cover">

                <div>Your Story</div>

            </div>

        `;

    });

}


/* PROFILE */

function showProfile(){

    const feed =
        document.getElementById("feed");


    const posts =
        getPosts();


    feed.innerHTML = `

        <div class="empty">

            <h2>Your Profile</h2>

            <br>

            <p>
                Posts: ${posts.length}
            </p>

            <br>

            <button
                class="create-main-btn"
                onclick="renderFeed()">
                Back to Home
            </button>

        </div>

    `;

}


/* HOME */

function showHome(){

    renderFeed();

}


/* SEARCH */

function searchPosts(){

    const query =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    const posts =
        getPosts();


    const filtered =
        posts.filter(post =>

            post.caption
                .toLowerCase()
                .includes(query)

            ||

            post.mention
                .toLowerCase()
                .includes(query)

        );


    const feed =
        document.getElementById("feed");


    if(!query){

        renderFeed();

        return;

    }


    if(filtered.length===0){

        feed.innerHTML =
            `<div class="empty">
                No matching posts found.
            </div>`;

        return;

    }


    const old =
        localStorage.getItem("social_posts");


    localStorage.setItem(
        "social_posts",
        JSON.stringify(filtered)
    );


    renderFeed();


    localStorage.setItem(
        "social_posts",
        old
    );

}


/* SECURITY */

function escapeHTML(text){

    if(!text) return "";

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* START */

renderFeed();

renderStories();


/* CLOSE MODAL WHEN CLICKING OUTSIDE */

document
    .getElementById("createModal")
    .addEventListener("click",function(e){

        if(e.target===this){

            closeCreate();

        }

    });

</script>
