<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#f7f7f8;
    --card:#ffffff;
    --text:#111111;
    --muted:#777;
    --border:#e7e7e7;
    --black:#111;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* ================= TOP BAR ================= */

.topbar{
    height:68px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.brand{
    font-size:25px;
    font-weight:800;
    letter-spacing:-1px;
}

.search-box{
    width:310px;
    height:40px;
    border:1px solid var(--border);
    background:#f3f3f4;
    border-radius:12px;
    padding:0 15px;
    outline:none;
}

.search-box:focus{
    background:#fff;
    border-color:#bbb;
}

.top-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.top-btn{
    border:0;
    background:transparent;
    padding:10px 13px;
    border-radius:10px;
    font-weight:600;
}

.top-btn:hover{
    background:#f1f1f1;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    top:68px;
    left:0;
    bottom:0;
    width:245px;
    background:#fff;
    border-right:1px solid var(--border);
    padding:25px 15px;
    z-index:90;
}

.nav-item{
    width:100%;
    height:48px;
    border:0;
    background:transparent;
    border-radius:11px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 15px;
    margin-bottom:6px;
    text-align:left;
    font-weight:600;
    color:#222;
}

.nav-item:hover{
    background:#f2f2f3;
}

.nav-item.active{
    background:#111;
    color:#fff;
}

.nav-icon{
    width:21px;
    height:21px;
    border:2px solid currentColor;
    border-radius:6px;
    flex-shrink:0;
}

/* ================= MAIN ================= */

.main{
    width:min(680px,calc(100% - 40px));
    margin:0 auto;
    padding-top:95px;
    padding-bottom:100px;
}

/* ================= STORIES ================= */

.stories{
    display:flex;
    gap:17px;
    overflow-x:auto;
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    padding:17px;
    margin-bottom:20px;
}

.stories::-webkit-scrollbar{
    display:none;
}

.story{
    min-width:68px;
    text-align:center;
    font-size:12px;
}

.story-avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 7px;
    font-size:18px;
    font-weight:700;
    overflow:hidden;
}

.story-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= CREATE PLUS BAR ================= */

.create-bar{
    height:65px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    margin-bottom:20px;
    padding:10px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.create-text{
    font-size:14px;
    color:#777;
}

.plus-button{
    width:45px;
    height:45px;
    border:0;
    border-radius:13px;
    background:#111;
    color:#fff;
    font-size:28px;
    line-height:1;
    transition:.2s;
}

.plus-button:hover{
    transform:scale(1.05);
    background:#333;
}

/* ================= POST ================= */

.post{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    margin-bottom:22px;
}

.post-header{
    height:65px;
    padding:10px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.username{
    font-size:14px;
    font-weight:700;
}

.post-type{
    font-size:11px;
    color:#888;
    margin-top:3px;
}

.more-btn{
    border:0;
    background:transparent;
    font-size:20px;
}

.media{
    width:100%;
    max-height:720px;
    display:block;
    object-fit:contain;
    background:#111;
}

.post-actions{
    display:flex;
    gap:18px;
    padding:13px 15px 7px;
}

.post-action{
    border:0;
    background:transparent;
    font-weight:600;
    padding:3px 0;
}

.post-action:hover{
    color:#555;
}

.post-content{
    padding:5px 15px 17px;
    line-height:1.5;
    font-size:14px;
}

.post-content strong{
    margin-right:5px;
}

.post-music{
    color:#666;
    margin-top:6px;
    font-size:12px;
}

.delete{
    color:#c00;
}

/* ================= EMPTY ================= */

.empty{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    text-align:center;
    padding:55px 20px;
    color:#777;
}

.empty h2{
    color:#111;
    margin-bottom:10px;
}

/* ================= RIGHT PANEL ================= */

.right-panel{
    position:fixed;
    top:100px;
    left:calc(50% + 370px);
    width:280px;
}

.panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.panel-title{
    font-weight:700;
    margin-bottom:15px;
}

.suggestion{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:13px 0;
}

.suggestion-left{
    display:flex;
    align-items:center;
    gap:9px;
}

.follow{
    border:0;
    background:transparent;
    color:#111;
    font-weight:700;
    font-size:12px;
}

/* ================= MOBILE NAV ================= */

.mobile-nav{
    display:none;
}

/* ================= MODAL ================= */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.62);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.overlay.show{
    display:flex;
}

.modal{
    width:min(650px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:20px;
    padding:23px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    font-size:21px;
}

.close{
    width:35px;
    height:35px;
    border:0;
    background:#f1f1f1;
    border-radius:50%;
    font-size:20px;
}

/* ================= CREATE MENU ================= */

.create-menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.create-option{
    min-height:135px;
    border:1px solid var(--border);
    background:#fafafa;
    border-radius:15px;
    padding:20px 10px;
    font-weight:700;
    transition:.2s;
}

.create-option:hover{
    background:#111;
    color:#fff;
    transform:translateY(-2px);
}

.option-symbol{
    width:45px;
    height:45px;
    border:2px solid currentColor;
    border-radius:12px;
    margin:0 auto 13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

/* ================= EDITOR ================= */

.editor{
    display:none;
}

.editor.show{
    display:block;
}

.media-choice{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.choice-btn{
    padding:18px 10px;
    border:1px solid var(--border);
    background:#fafafa;
    border-radius:12px;
    font-weight:700;
}

.choice-btn:hover{
    background:#f0f0f0;
}

.file-input{
    display:none;
}

.preview{
    margin-top:17px;
}

.preview img,
.preview video{
    width:100%;
    max-height:450px;
    object-fit:contain;
    background:#111;
    border-radius:12px;
}

.field{
    margin-top:15px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    outline:none;
    background:#fff;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.publish{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#111;
    color:#fff;
    font-weight:700;
}

.publish:hover{
    background:#333;
}

/* ================= FILTERS ================= */

.filters{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-top:13px;
}

.filter{
    white-space:nowrap;
    border:1px solid #ddd;
    background:#fff;
    border-radius:20px;
    padding:8px 12px;
    font-size:12px;
}

.filter.active{
    background:#111;
    color:#fff;
}

/* ================= CAMERA ================= */

.camera{
    display:none;
}

.camera.show{
    display:block;
}

.camera video{
    width:100%;
    max-height:500px;
    background:#111;
    border-radius:12px;
}

.camera-controls{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.camera-controls button{
    flex:1;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fff;
    font-weight:700;
}

.recording{
    background:#b00000 !important;
    color:#fff !important;
}

/* ================= PROFILE ================= */

.profile-head{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    padding:25px;
    display:flex;
    gap:20px;
    align-items:center;
}

.profile-avatar{
    width:90px;
    height:90px;
    background:#111;
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:700;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

    .right-panel{
        display:none;
    }

}

@media(max-width:850px){

    .topbar{
        height:62px;
        padding:0 13px;
    }

    .brand{
        font-size:21px;
    }

    .top-right{
        display:none;
    }

    .search-box{
        width:145px;
        height:37px;
    }

    .sidebar{
        display:none;
    }

    .main{
        width:100%;
        padding:78px 9px 90px;
    }

    .stories{
        border-radius:13px;
    }

    .create-bar{
        border-radius:13px;
    }

    .post{
        border-radius:13px;
    }

    .mobile-nav{
        display:grid;
        grid-template-columns:1fr 1fr 1.2fr 1fr 1fr;
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        height:68px;
        background:#fff;
        border-top:1px solid var(--border);
        z-index:300;
        padding:8px 5px;
    }

    .mobile-nav button{
        border:0;
        background:transparent;
        font-size:10px;
        font-weight:700;
        border-radius:10px;
    }

    .mobile-nav .mobile-plus{
        background:#111;
        color:#fff;
        margin:3px 10px;
        font-size:25px;
    }

    .overlay{
        align-items:flex-end;
        padding:0;
    }

    .modal{
        max-height:93vh;
        border-radius:20px 20px 0 0;
        padding:20px 15px;
    }

    .create-menu{
        grid-template-columns:1fr;
    }

    .create-option{
        min-height:75px;
        display:flex;
        align-items:center;
        gap:15px;
        padding:12px 15px;
    }

    .option-symbol{
        margin:0;
        width:42px;
        height:42px;
        flex-shrink:0;
    }

    .media-choice{
        grid-template-columns:1fr;
    }

    .camera-controls{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<!-- ================= TOP BAR ================= -->

<header class="topbar">

    <div class="brand">Social</div>

    <input
        id="searchInput"
        class="search-box"
        type="search"
        placeholder="Search"
        oninput="searchUsers()"
    >

    <div class="top-right">

        <button class="top-btn" onclick="showNotifications()">
            Notifications
        </button>

        <button class="top-btn" onclick="showMessages()">
            Messages
        </button>

    </div>

</header>


<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <button class="nav-item active" onclick="showHome(this)">
        <span class="nav-icon"></span>
        Home
    </button>

    <button class="nav-item" onclick="focusSearch()">
        <span class="nav-icon"></span>
        Search
    </button>

    <button class="nav-item" onclick="showExplore(this)">
        <span class="nav-icon"></span>
        Explore
    </button>

    <button class="nav-item" onclick="showReels(this)">
        <span class="nav-icon"></span>
        Reels
    </button>

    <button class="nav-item" onclick="showMessages(this)">
        <span class="nav-icon"></span>
        Messages
    </button>

    <button class="nav-item" onclick="showNotifications(this)">
        <span class="nav-icon"></span>
        Notifications
    </button>

    <button class="nav-item" onclick="showProfile(this)">
        <span class="nav-icon"></span>
        Profile
    </button>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <!-- STORIES -->

    <section class="stories" id="stories">

        <div class="story">
            <div
                class="story-avatar"
                onclick="openCreateMenu()">
                +
            </div>
            <span>Add Story</span>
        </div>

    </section>


    <!-- CLEAN CREATE BAR -->

    <section class="create-bar">

        <div class="create-text">
            Create a new post
        </div>

        <button
            class="plus-button"
            onclick="openCreateMenu()">
            +
        </button>

    </section>


    <!-- CONTENT -->

    <section id="content"></section>

</main>


<!-- ================= RIGHT PANEL ================= -->

<aside class="right-panel">

    <div class="panel">

        <div class="panel-title">
            Suggestions
        </div>

        <div class="suggestion">

            <div class="suggestion-left">
                <div class="avatar">A</div>
                <span>User</span>
            </div>

            <button class="follow">
                Follow
            </button>

        </div>

        <div class="suggestion">

            <div class="suggestion-left">
                <div class="avatar">S</div>
                <span>Creator</span>
            </div>

            <button class="follow">
                Follow
            </button>

        </div>

    </div>

</aside>


<!-- ================= MOBILE NAV ================= -->

<nav class="mobile-nav">

    <button onclick="showHome()">
        Home
    </button>

    <button onclick="focusSearch()">
        Search
    </button>

    <button
        class="mobile-plus"
        onclick="openCreateMenu()">
        +
    </button>

    <button onclick="showNotifications()">
        Notifications
    </button>

    <button onclick="showProfile()">
        Profile
    </button>

</nav>


<!-- ================= CREATE MENU ================= -->

<div class="overlay" id="createOverlay">

    <div class="modal">

        <div class="modal-header">

            <h2>Create</h2>

            <button
                class="close"
                onclick="closeAllModals()">
                ×
            </button>

        </div>


        <div class="create-menu">

            <button
                class="create-option"
                onclick="startCreate('photo')">

                <div class="option-symbol">
                    +
                </div>

                <div>
                    Photo Post
                </div>

            </button>


            <button
                class="create-option"
                onclick="startCreate('reel')">

                <div class="option-symbol">
                    R
                </div>

                <div>
                    Reel
                </div>

            </button>


            <button
                class="create-option"
                onclick="startCreate('story')">

                <div class="option-symbol">
                    S
                </div>

                <div>
                    Story
                </div>

            </button>

        </div>

    </div>

</div>


<!-- ================= EDITOR ================= -->

<div class="overlay" id="editorOverlay">

    <div class="modal">

        <div class="modal-header">

            <h2 id="editorTitle">
                Create Photo
            </h2>

            <button
                class="close"
                onclick="closeAllModals()">
                ×
            </button>

        </div>


        <div id="choiceArea">

            <div class="media-choice">

                <button
                    class="choice-btn"
                    onclick="chooseMedia()">
                    Choose From Gallery
                </button>

                <button
                    class="choice-btn"
                    onclick="openCamera()">
                    Use Camera
                </button>

            </div>

            <input
                class="file-input"
                id="mediaInput"
                type="file"
                onchange="handleMedia(event)"
            >

        </div>


        <!-- CAMERA -->

        <div
            class="camera"
            id="cameraArea">

            <video
                id="cameraVideo"
                autoplay
                playsinline>
            </video>

            <div class="camera-controls">

                <button
                    id="captureBtn"
                    onclick="capturePhoto()">
                    Take Photo
                </button>

                <button
                    id="recordBtn"
                    onclick="toggleRecording()">
                    Start Recording
                </button>

                <button onclick="stopCamera()">
                    Close Camera
                </button>

            </div>

        </div>


        <!-- EDITOR -->

        <div
            class="editor"
            id="editor">

            <div
                class="preview"
                id="preview">
            </div>


            <div
                class="filters">

                <button
                    class="filter active"
                    onclick="setFilter('none',this)">
                    Original
                </button>

                <button
                    class="filter"
                    onclick="setFilter('grayscale(1)',this)">
                    Mono
                </button>

                <button
                    class="filter"
                    onclick="setFilter('sepia(.7)',this)">
                    Vintage
                </button>

                <button
                    class="filter"
                    onclick="setFilter('contrast(1.4)',this)">
                    Contrast
                </button>

                <button
                    class="filter"
                    onclick="setFilter('saturate(1.7)',this)">
                    Vivid
                </button>

                <button
                    class="filter"
                    onclick="setFilter('brightness(1.25)',this)">
                    Bright
                </button>

            </div>


            <div class="field">

                <label>
                    Caption
                </label>

                <textarea
                    id="caption"
                    placeholder="Write a caption...">
                </textarea>

            </div>


            <div class="field">

                <label>
                    Mention
                </label>

                <input
                    id="mention"
                    placeholder="@username"
                >

            </div>


            <div class="field">

                <label>
                    Music
                </label>

                <select id="music">

                    <option value="">
                        No Music
                    </option>

                    <option value="Summer">
                        Summer
                    </option>

                    <option value="Night">
                        Night
                    </option>

                    <option value="Dream">
                        Dream
                    </option>

                    <option value="Energy">
                        Energy
                    </option>

                </select>

            </div>


            <button
                class="publish"
                onclick="publish()">
                Publish
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let currentType = "photo";
let currentFile = null;
let currentURL = null;

let cameraStream = null;
let recorder = null;
let chunks = [];
let recording = false;

let selectedFilter = "none";


/* =====================================================
   STORAGE
===================================================== */

function getPosts(){

    try{

        return JSON.parse(
            localStorage.getItem("social_posts") || "[]"
        );

    }catch{

        return [];

    }

}

function savePosts(posts){

    localStorage.setItem(
        "social_posts",
        JSON.stringify(posts)
    );

}


/* =====================================================
   CREATE MENU
===================================================== */

function openCreateMenu(){

    document
        .getElementById("createOverlay")
        .classList.add("show");

}


function startCreate(type){

    currentType = type;

    document
        .getElementById("createOverlay")
        .classList.remove("show");

    const title =
        document.getElementById("editorTitle");

    if(type === "photo"){

        title.textContent = "Create Photo";

        document
            .getElementById("mediaInput")
            .accept = "image/*";

    }

    if(type === "reel"){

        title.textContent = "Create Reel";

        document
            .getElementById("mediaInput")
            .accept = "video/*";

    }

    if(type === "story"){

        title.textContent = "Add Story";

        document
            .getElementById("mediaInput")
            .accept = "image/*";

    }


    resetEditor();

    document
        .getElementById("editorOverlay")
        .classList.add("show");

}


/* =====================================================
   RESET
===================================================== */

function resetEditor(){

    currentFile = null;
    currentURL = null;
    selectedFilter = "none";

    document
        .getElementById("choiceArea")
        .style.display = "block";

    document
        .getElementById("cameraArea")
        .classList.remove("show");

    document
        .getElementById("editor")
        .classList.remove("show");

    document
        .getElementById("preview")
        .innerHTML = "";

    document
        .getElementById("caption")
        .value = "";

    document
        .getElementById("mention")
        .value = "";

    document
        .getElementById("music")
        .value = "";

}


/* =====================================================
   GALLERY
===================================================== */

function chooseMedia(){

    document
        .getElementById("mediaInput")
        .click();

}


function handleMedia(event){

    const file =
        event.target.files[0];

    if(!file) return;


    if(
        currentType === "reel"
        &&
        !file.type.startsWith("video/")
    ){

        alert("Please select a video.");

        return;

    }


    if(
        currentType !== "reel"
        &&
        !file.type.startsWith("image/")
    ){

        alert("Please select an image.");

        return;

    }


    currentFile = file;

    currentURL =
        URL.createObjectURL(file);

    showEditor();

}


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:true,

                audio:
                    currentType === "reel"

            });


        const video =
            document.getElementById("cameraVideo");

        video.srcObject =
            cameraStream;


        document
            .getElementById("choiceArea")
            .style.display = "none";

        document
            .getElementById("cameraArea")
            .classList.add("show");


        const capture =
            document.getElementById("captureBtn");

        const record =
            document.getElementById("recordBtn");


        if(
            currentType === "photo"
            ||
            currentType === "story"
        ){

            capture.style.display = "block";

            record.style.display = "none";

        }else{

            capture.style.display = "none";

            record.style.display = "block";

        }

    }catch(error){

        alert(
            "Camera permission allow karo. Reel record karne ke liye microphone permission bhi allow karo."
        );

    }

}


/* =====================================================
   PHOTO CAPTURE
===================================================== */

function capturePhoto(){

    if(!cameraStream) return;


    const video =
        document.getElementById("cameraVideo");


    const canvas =
        document.createElement("canvas");


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext("2d");


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvas.toBlob(blob => {

        currentFile =
            new File(
                [blob],
                "photo.jpg",
                {
                    type:"image/jpeg"
                }
            );


        currentURL =
            URL.createObjectURL(blob);


        stopCamera();

        showEditor();

    },"image/jpeg",.92);

}


/* =====================================================
   REEL RECORDING
===================================================== */

function toggleRecording(){

    if(recording){

        stopRecording();

    }else{

        startRecording();

    }

}


function startRecording(){

    if(!cameraStream) return;


    chunks = [];


    let options = {};

    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9,opus"
        )
    ){

        options.mimeType =
            "video/webm;codecs=vp9,opus";

    }


    try{

        recorder =
            new MediaRecorder(
                cameraStream,
                options
            );

    }catch{

        recorder =
            new MediaRecorder(
                cameraStream
            );

    }


    recorder.ondataavailable =
        event => {

            if(event.data.size > 0){

                chunks.push(event.data);

            }

        };


    recorder.onstop = () => {

        const blob =
            new Blob(
                chunks,
                {
                    type:
                        recorder.mimeType ||
                        "video/webm"
                }
            );


        currentFile =
            new File(
                [blob],
                "reel.webm",
                {
                    type:blob.type
                }
            );


        currentURL =
            URL.createObjectURL(blob);


        stopCamera();

        showEditor();

    };


    recorder.start();

    recording = true;


    const button =
        document.getElementById("recordBtn");

    button.textContent =
        "Stop Recording";

    button.classList.add("recording");

}


function stopRecording(){

    if(
        recorder &&
        recording
    ){

        recorder.stop();

        recording = false;

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(track =>
                track.stop()
            );

        cameraStream = null;

    }


    const video =
        document.getElementById("cameraVideo");

    if(video){

        video.srcObject = null;

    }


    recording = false;


    const button =
        document.getElementById("recordBtn");

    if(button){

        button.textContent =
            "Start Recording";

        button.classList.remove(
            "recording"
        );

    }

}


/* =====================================================
   EDITOR
===================================================== */

function showEditor(){

    document
        .getElementById("choiceArea")
        .style.display = "none";

    document
        .getElementById("cameraArea")
        .classList.remove("show");

    document
        .getElementById("editor")
        .classList.add("show");


    const preview =
        document.getElementById("preview");


    if(
        currentFile.type.startsWith("video/")
    ){

        preview.innerHTML = `

            <video
                id="previewMedia"
                src="${currentURL}"
                controls
                playsinline>
            </video>

        `;

    }else{

        preview.innerHTML = `

            <img
                id="previewMedia"
                src="${currentURL}"
                alt="Preview">

        `;

    }

}


/* =====================================================
   FILTER
===================================================== */

function setFilter(filter,button){

    selectedFilter = filter;


    document
        .querySelectorAll(".filter")
        .forEach(item =>
            item.classList.remove("active")
        );


    button.classList.add("active");


    const media =
        document.getElementById(
            "previewMedia"
        );


    if(media){

        media.style.filter =

            ? "none"
            : filter;

    }

}


/* =====================================================
   PUBLISH
===================================================== */

function publish(){

    if(!currentFile){

        alert(
            "Pehle Photo, Reel ya Story select karo."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload = () => {

        const posts =
            getPosts();


        posts.unshift({

            id:Date.now(),

            type:currentType,

            media:reader.result,

            caption:
                document
                .getElementById("caption")
                .value
                .trim(),

            mention:
                document
                .getElementById("mention")
                .value
                .trim(),

            music:
                document
                .getElementById("music")
                .value,

            likes:0,

            comments:[],

            createdAt:
                new Date().toISOString()

        });


        savePosts(posts);

        closeAllModals();

        renderHome();

        renderStories();

    };


    reader.readAsDataURL(currentFile);

}


/* =====================================================
   FEED
===================================================== */

function renderHome(){

    const content =
        document.getElementById("content");

    const posts =
        getPosts();


    if(posts.length === 0){

        content.innerHTML = `

            <div class="empty">

                <h2>Your feed is empty</h2>

                <p>
                    Tap the + button to create your first post.
                </p>

            </div>

        `;

        return;

    }


    content.innerHTML =
        posts.map(createPostHTML).join("");

}


function createPostHTML(post){

    let media = "";


    if(post.type === "reel"){

        media = `

            <video
                class="media"
                src="${post.media}"
                controls
                playsinline
                loop>
            </video>

        `;

    }else{

        media = `

            <img
                class="media"
                src="${post.media}"
                alt="Post">

        `;

    }


    return `

        <article
            class="post"
            id="post-${post.id}">

            <div class="post-header">

                <div class="user">

                    <div class="avatar">
                        U
                    </div>

                    <div>

                        <div class="username">
                            Your Account
                        </div>

                        <div class="post-type">
                            ${
                                post.type === "reel"
                                ? "Reel"
                                : post.type === "story"
                                ? "Story"
                                : "Photo Post"
                            }
                        </div>

                    </div>

                </div>


                <button
                    class="more-btn"
                    onclick="deletePost(${post.id})">
                    ...
                </button>

            </div>


            ${media}


            <div class="post-actions">

                <button
                    class="post-action"
                    onclick="likePost(${post.id})">
                    Like ${post.likes || 0}
                </button>

                <button
                    class="post-action"
                    onclick="commentPost(${post.id})">
                    Comment
                </button>

                <button
                    class="post-action"
                    onclick="sharePost(${post.id})">
                    Share
                </button>

            </div>


            <div class="post-content">

                <strong>
                    Your Account
                </strong>

                ${escapeHTML(post.caption)}

                ${
                    post.mention
                    ?
                    `<br>${escapeHTML(post.mention)}`
                    :
                    ""
                }

                ${
                    post.music
                    ?
                    `
                    <div class="post-music">
                        Music: ${escapeHTML(post.music)}
                    </div>
                    `
                    :
                    ""
                }

            </div>

        </article>

    `;

}


/* =====================================================
   LIKE
===================================================== */

function likePost(id){

    const posts =
        getPosts();

    const post =
        posts.find(
            item => item.id === id
        );


    if(post){

        post.likes =
            (post.likes || 0) + 1;

        savePosts(posts);

        renderHome();

    }

}


/* =====================================================
   COMMENT
===================================================== */

function commentPost(id){

    const comment =
        prompt("Write a comment");


    if(!comment) return;


    const posts =
        getPosts();

    const post =
        posts.find(
            item => item.id === id
        );


    if(post){

        post.comments =
            post.comments || [];

        post.comments.push(
            comment
        );

        savePosts(posts);

        alert("Comment added.");

    }

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost(id){

    const link =
        location.href +
        "#post-" +
        id;


    if(navigator.share){

        try{

            await navigator.share({

                title:"Social Post",

                text:"Check this post",

                url:link

            });

        }catch{}

    }else{

        try{

            await navigator.clipboard
                .writeText(link);

            alert("Post link copied.");

        }catch{

            alert(link);

        }

    }

}


/* =====================================================
   DELETE
===================================================== */

function deletePost(id){

    if(
        !confirm(
            "Delete this post?"
        )
    ) return;


    const posts =
        getPosts()
        .filter(
            post => post.id !== id
        );


    savePosts(posts);

    renderHome();

    renderStories();

}


/* =====================================================
   STORIES
===================================================== */

function renderStories(){

    const container =
        document.getElementById("stories");


    const stories =
        getPosts()
        .filter(
            post => post.type === "story"
        );


    container.innerHTML = `

        <div
            class="story"
            onclick="openCreateMenu()">

            <div class="story-avatar">
                +
            </div>

            <span>
                Add Story
            </span>

        </div>

    `;


    stories
        .slice(0,8)
        .forEach(story => {

            container.innerHTML += `

                <div class="story">

                    <div class="story-avatar">

                        <img
                            src="${story.media}"
                            alt="Story">

                    </div>

                    <span>
                        Your Story
                    </span>

                </div>

            `;

        });

}


/* =====================================================
   SEARCH
===================================================== */

function focusSearch(){

    const input =
        document.getElementById(
            "searchInput"
        );

    input.focus();

}


function searchUsers(){

    const query =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if(!query){

        renderHome();

        return;

    }


    const posts =
        getPosts();


    const results =
        posts.filter(post =>

            (post.caption || "")
                .toLowerCase()
                .includes(query)

            ||

            (post.mention || "")
                .toLowerCase()
                .includes(query)

        );


    const content =
        document.getElementById(
            "content"
        );


    if(results.length === 0){

        content.innerHTML = `

            <div class="empty">

                <h2>No results</h2>

                <p>
                    No matching posts found.
                </p>

            </div>

        `;

        return;

    }


    content.innerHTML =
        results.map(
            createPostHTML
        ).join("");

}

function closeAllModals(){

/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value){

    if(!value) return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
